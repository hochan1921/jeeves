<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニュース</title>
<style>
:root{
  --bg:#faf8f4; --panel:#ffffff; --ink:#1d1b17; --muted:#847c6e; --line:#e7e1d6; --a:#3f6fa6;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#131210; --panel:#1c1a17; --ink:#ece7de; --muted:#948c7e; --line:#2c2925; --a:#8fb3e0; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 64px}

header{display:flex;align-items:baseline;justify-content:flex-end;gap:16px;flex-wrap:wrap;
       padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
h1{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.14em;margin:0}
.dot{width:6px;height:6px;border-radius:50%;background:#6ea87f;opacity:.85;
     margin-left:auto;align-self:center}
.dot.off{background:#c0554f}
.nav{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:.06em}
.nav:hover{color:var(--ink)}
header nav{display:flex;gap:16px}  /* 狭い画面では、ページへのリンクをまとめて右に折り返す */

/* 種類ごとのタブ。多ければ横に流す */
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px}
.tabs a{flex:none;font-size:14px;letter-spacing:.06em;color:var(--muted);text-decoration:none;
        padding:8px 16px;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current]{color:var(--ink);font-weight:600;border-color:var(--a)}

.doc{max-width:720px;font-size:15px;line-height:1.85}
.aim{font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:8px}
.doc h1{font-size:22px;letter-spacing:.08em;margin:0 0 20px}
.doc h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:32px 0 12px;
        padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc h3{font-size:15px;font-weight:600;margin:26px 0 6px}
.doc h4{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 4px}
.doc p,.doc ul,.tbl{margin:0 0 14px}
.doc ul{padding-left:1.3em}
.doc li{margin-bottom:8px}
.doc hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.doc a{color:var(--a);text-underline-offset:3px;text-decoration-thickness:1px}
.doc strong{font-weight:600}
.tbl{overflow-x:auto}
.doc table{border-collapse:collapse;font-size:13px;line-height:1.6}
.doc th,.doc td{text-align:left;vertical-align:top;padding:7px 18px 7px 0;border-bottom:1px solid var(--line)}
.doc th{color:var(--muted);font-weight:600;white-space:nowrap}

.empty{font-size:13px;color:var(--muted)}
.note{margin-top:48px;font-size:12px;color:var(--muted);opacity:.75}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
     background:rgba(128,128,128,.14);padding:2px 6px;border-radius:4px}
.err{background:var(--panel);border:1px solid #c0554f;border-radius:10px;padding:18px 20px;
     font-size:13px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ニュース</h1>
    <span class="dot" id="dot" title="読込中"></span>
    <nav><a class="nav" href="./">ダッシュボード →</a><a class="nav" href="study.html">勉強 →</a></nav>
  </header>
  <main id="main"></main>
</div>

<script>
const BASE='data/news/';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cells = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());

/* 書式は勉強ページと同じ。文中で拾うのはリンクと太字だけ。飛び先は http(s) と、別の種類への #種類名 に限る */
const inline = s => esc(s)
  .replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, (_,t,u)=>
    /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>`
    : u[0]==='#' ? `<a href="${u}">${t}</a>` : t)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

/* 行で拾うのは 見出し・段落・箇条書き・表・区切り線だけ。ほかは地の文として出す */
function blocks(md){
  const out=[]; let para=[], list=null, rows=null;
  const flush=()=>{
    if(para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`);
    if(list) out.push(`<ul>${list.map(i=>`<li>${inline(i)}</li>`).join('')}</ul>`);
    if(rows){ const [h,...b]=rows;
      out.push(`<div class="tbl"><table><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr>${
        b.map(r=>`<tr>${h.map((_,i)=>`<td>${inline(r[i]??'')}</td>`).join('')}</tr>`).join('')}</table></div>`); }
    para=[]; list=null; rows=null;
  };
  for (const raw of md.split(/\r?\n/)){
    const t=raw.trim(); let m;
    if (!t){ flush(); continue; }
    if ((m=t.match(/^(#{1,4})\s+(.*)$/))){ flush(); const n=m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(t)){ flush(); out.push('<hr>'); continue; }
    if (t.startsWith('|')){
      const c=cells(t); if (c.every(x=>/^:?-{2,}:?$/.test(x))) continue;
      if (!rows){ flush(); rows=[]; } rows.push(c); continue;
    }
    if ((m=t.match(/^[-*](?:\s+(.*))?$/))){ if (!list){ flush(); list=[]; } list.push(m[1]||''); continue; }
    if (list||rows) flush();
    para.push(t);
  }
  flush();
  return out.join('');
}

/* 種類は data/news/ の .md をそのまま並べる。名前はフォルダの目次から拾い、コードには持たない */
const ja = (a,b) => a.localeCompare(b,'ja');
async function kinds(){
  const r=await fetch(BASE,{cache:'no-store'});
  if (r.status===404) return [];  // 無いのは、まだ置いていないだけ
  if (!r.ok) throw 0;
  return [...new DOMParser().parseFromString(await r.text(),'text/html').querySelectorAll('a[href]')]
    .map(a=>{ try{ return decodeURIComponent(a.getAttribute('href')); }catch(e){ return ''; } })
    .filter(h=>/^[^./][^/]*\.md$/.test(h)).map(h=>h.slice(0,-3)).sort(ja);
}
const wanted = () => { try{ return decodeURIComponent(location.hash.slice(1)); }catch(e){ return ''; } };
const enc = encodeURIComponent;

const main=document.getElementById('main');

function render(ks, k, md){
  document.title = k ? `${k}｜ニュース` : 'ニュース';
  if (!ks.length){
    main.innerHTML=`<p class="empty">種類はまだありません。<code>data/news/AI.md</code> のように置くと、ここにタブが並びます。</p>`;
    return;
  }
  // 先頭の「# 題」はタブと同じなので出さない。「---」より上はねらいで、細く出す
  const lines=md.replace(/^\s*#[ \t]+.*/,'').split(/\r?\n/), cut=lines.findIndex(l=>/^\s*-{3,}\s*$/.test(l));
  const aim=lines.slice(0,Math.max(cut,0)).join('\n'), news=lines.slice(cut+1).join('\n');
  main.innerHTML=`<nav class="tabs">${ks.map(n=>
      `<a href="#${enc(n)}"${n===k?' aria-current="page"':''}>${esc(n)}</a>`).join('')}</nav>
    <article class="doc">${aim.trim()?`<div class="aim">${blocks(aim)}</div>`:''}${news.trim()?blocks(news)
      :'<p class="empty">まだありません。毎朝の更新で、ここに入ります。</p>'}
    </article>
    <p class="note">data/news/ をそのまま映しています。毎朝、執事が書き換えます。</p>`;
}

function fail(){
  main.innerHTML=`<div class="err">
    <b>data/news/ を読めませんでした。</b><br>
    起動：<code>python3 server.py</code> → <code>http://localhost:8765/news.html</code><br>
    （file:// で直接開くと読めません。かならずサーバー越しに）
  </div>`;
}

/* 5 秒ごとに読み直す。執事が書き換えれば、開いたまま変わる */
let last=null;
async function tick(){
  const dot=document.getElementById('dot'), hash=location.hash;
  try{
    const ks=await kinds(), w=wanted(), k=ks.includes(w)?w:(ks[0]||'');
    let md='';
    if (k){ const f=await fetch(BASE+enc(k)+'.md',{cache:'no-store'}); if (f.ok) md=await f.text(); }
    if (hash!==location.hash) return;  // 読んでいる間に開く先が替わった。新しいほうに任せる
    const key=JSON.stringify([ks, k, md]);
    if (key!==last){ last=key; render(ks, k, md); }
    dot.classList.remove('off'); dot.title='追従中';
  }catch(e){
    dot.classList.add('off'); dot.title='未接続';
    if (last===null) fail();
  }
}
addEventListener('hashchange', ()=>tick().then(()=>scrollTo(0,0)));
tick(); setInterval(tick,5000);
</script>
</body>
</html>
