<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニュース</title>
<style>
:root{
  --bg:#faf8f4; --panel:#ffffff; --ink:#1d1b17; --muted:#847c6e; --line:#e7e1d6; --a:#3f6fa6;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#131210; --panel:#1c1a17; --ink:#ece7de; --muted:#948c7e; --line:#2c2925; --a:#8fb3e0; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 64px}

header{display:flex;align-items:baseline;justify-content:flex-end;gap:16px;flex-wrap:wrap;
       padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
h1{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.14em;margin:0}
.dot{width:6px;height:6px;border-radius:50%;background:#6ea87f;opacity:.85;
     margin-left:auto;align-self:center}
.dot.off{background:#c0554f}

/* 種類ごとのタブ。多ければ横に流す */
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px}
.tabs a{flex:none;font-size:14px;letter-spacing:.06em;color:var(--muted);text-decoration:none;
        padding:8px 16px;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current]{color:var(--ink);font-weight:600;border-color:var(--a)}

.doc{max-width:720px;font-size:15px;line-height:1.85}
.aim{font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:8px}
.doc h1{font-size:22px;letter-spacing:.08em;margin:0 0 20px}
.doc h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:32px 0 12px;
        padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc h3{font-size:15px;font-weight:600;margin:26px 0 6px}
.doc h4{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 4px}
.doc p,.doc ul,.tbl{margin:0 0 14px}
.doc ul{padding-left:1.3em}
.doc li{margin-bottom:8px}
.doc hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.doc a{color:var(--a);text-underline-offset:3px;text-decoration-thickness:1px}
.doc strong{font-weight:600}
.tbl{overflow-x:auto}
.doc table{border-collapse:collapse;font-size:13px;line-height:1.6}
.doc th,.doc td{text-align:left;vertical-align:top;padding:7px 18px 7px 0;border-bottom:1px solid var(--line)}
.doc th{color:var(--muted);font-weight:600;white-space:nowrap}

/* 各ニュースの「深堀り」。押すと深堀りのタブに「作業中...」で入り、執事が解説を書く */
.dig{font:inherit;font-size:12px;letter-spacing:.06em;color:var(--muted);background:none;
     border:1px solid var(--line);border-radius:999px;padding:1px 10px;margin-left:8px;cursor:pointer;
     vertical-align:1px}
.dig:hover{color:var(--ink);border-color:var(--muted)}
.dig:disabled{cursor:default;opacity:.6}

.empty{font-size:13px;color:var(--muted)}
.note{margin-top:48px;font-size:12px;color:var(--muted);opacity:.75}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
     background:rgba(128,128,128,.14);padding:2px 6px;border-radius:4px}
.err{background:var(--panel);border:1px solid #c0554f;border-radius:10px;padding:18px 20px;
     font-size:13px;line-height:1.9}
/* 全ページ共通の左メニュー。3 枚とも同じものを持つ。スマホでは上に寝かせる */
body{padding-left:200px}
.gnav{position:fixed;top:0;bottom:0;left:0;width:200px;padding:34px 14px;z-index:10;
      display:flex;flex-direction:column;gap:2px;background:var(--panel);border-right:1px solid var(--line)}
.gnav .brand{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.16em;padding:0 12px 24px}
.gnav a{display:flex;align-items:center;gap:11px;font-size:14px;letter-spacing:.06em;color:var(--muted);
        text-decoration:none;padding:9px 12px;border-radius:8px}
.gnav a:hover{color:var(--ink);background:rgba(128,128,128,.08)}
.gnav a[aria-current]{color:var(--ink);font-weight:600;background:rgba(128,128,128,.14)}
.gnav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round}
@media (max-width:720px){
  body{padding-left:0}
  .gnav{position:sticky;bottom:auto;width:auto;flex-direction:row;padding:8px 12px;
        border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .gnav .brand{display:none}
  .gnav a{flex:none;padding:7px 12px}
}
</style>
</head>
<body>
<nav class="gnav" aria-label="ページ">
  <span class="brand">jeeves</span>
  <a href="./"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>ダッシュボード</a>
  <a href="study.html"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>教養</a>
  <a href="study.html?d=映画"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M7.5 5.5v13M16.5 5.5v13M3.5 10h4M3.5 14h4M16.5 10h4M16.5 14h4"/></svg>映画</a>
  <a href="study.html?d=ゲーム"><svg viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.4 1.8L14.5 14h-5l-1.1 1.3A3 3 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"/><path d="M7.5 10.5v3M6 12h3"/><path d="M15.5 11.5h.01M17.5 12.5h.01"/></svg>ゲーム</a>
  <a href="study.html?d=本"><svg viewBox="0 0 24 24"><path d="M5.5 18.5V5.5a2 2 0 0 1 2-2h11v14h-11a2 2 0 0 0-2 2 2 2 0 0 0 2 2h11"/><path d="M9.5 7.5h5"/></svg>本</a>
  <a href="news.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4.5 4.5h12v15h-10a2 2 0 0 1-2-2z"/><path d="M16.5 8.5h3v9a2 2 0 0 1-2 2h-1"/><path d="M8 8.5h5M8 12h5M8 15.5h3"/></svg>ニュース</a>
</nav>
<div class="wrap">
  <header>
    <h1>ニュース</h1>
    <span class="dot" id="dot" title="読込中"></span>
  </header>
  <main id="main"></main>
</div>

<script>
const BASE='data/news/';
const DIG='深堀り', DIGFILE='data/深堀り.md';  // 深堀りは種類ではないので data/ 直下。タブはいつも一番左
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cells = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());

/* 書式は教養ページと同じ。文中で拾うのはリンクと太字だけ。飛び先は http(s) と、別の種類への #種類名 に限る */
const inline = s => esc(s)
  .replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, (_,t,u)=>
    /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>`
    : u[0]==='#' ? `<a href="${u}">${t}</a>` : t)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

/* 行で拾うのは 見出し・段落・箇条書き・表・区切り線だけ。ほかは地の文として出す */
function blocks(md){
  const out=[]; let para=[], list=null, rows=null;
  const flush=()=>{
    if(para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`);
    if(list) out.push(`<ul>${list.map(i=>`<li>${inline(i)}</li>`).join('')}</ul>`);
    if(rows){ const [h,...b]=rows;
      out.push(`<div class="tbl"><table><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr>${
        b.map(r=>`<tr>${h.map((_,i)=>`<td>${inline(r[i]??'')}</td>`).join('')}</tr>`).join('')}</table></div>`); }
    para=[]; list=null; rows=null;
  };
  for (const raw of md.split(/\r?\n/)){
    const t=raw.trim(); let m;
    if (!t){ flush(); continue; }
    if ((m=t.match(/^(#{1,4})\s+(.*)$/))){ flush(); const n=m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(t)){ flush(); out.push('<hr>'); continue; }
    if (t.startsWith('|')){
      const c=cells(t); if (c.every(x=>/^:?-{2,}:?$/.test(x))) continue;
      if (!rows){ flush(); rows=[]; } rows.push(c); continue;
    }
    if ((m=t.match(/^[-*](?:\s+(.*))?$/))){ if (!list){ flush(); list=[]; } list.push(m[1]||''); continue; }
    if (list||rows) flush();
    para.push(t);
  }
  flush();
  return out.join('');
}

/* 種類は data/news/ の .md をそのまま並べる。名前はフォルダの目次から拾い、コードには持たない */
const ja = (a,b) => a.localeCompare(b,'ja');
async function kinds(){
  const r=await fetch(BASE,{cache:'no-store'});
  if (r.status===404) return [];  // 無いのは、まだ置いていないだけ
  if (!r.ok) throw 0;
  return [...new DOMParser().parseFromString(await r.text(),'text/html').querySelectorAll('a[href]')]
    .map(a=>{ try{ return decodeURIComponent(a.getAttribute('href')); }catch(e){ return ''; } })
    .filter(h=>/^[^./][^/]*\.md$/.test(h)).map(h=>h.slice(0,-3)).sort(ja);
}
const wanted = () => { try{ return decodeURIComponent(location.hash.slice(1)); }catch(e){ return ''; } };
const enc = encodeURIComponent;

const main=document.getElementById('main');

function render(ks, k, md){
  document.title = k ? `${k}｜ニュース` : 'ニュース';
  if (ks.length<2){
    main.innerHTML=`<p class="empty">種類はまだありません。<code>data/news/AI.md</code> のように置くと、ここにタブが並びます。</p>`;
    return;
  }
  // 先頭の「# 題」はタブと同じなので出さない。「---」より上はねらいで、細く出す
  const lines=md.replace(/^\s*#[ \t]+.*/,'').split(/\r?\n/), cut=lines.findIndex(l=>/^\s*-{3,}\s*$/.test(l));
  const aim=lines.slice(0,Math.max(cut,0)).join('\n'), news=lines.slice(cut+1).join('\n');
  main.innerHTML=`<nav class="tabs">${ks.map(n=>
      `<a href="#${enc(n)}"${n===k?' aria-current="page"':''}>${esc(n)}</a>`).join('')}</nav>
    <article class="doc">${aim.trim()?`<div class="aim">${blocks(aim)}</div>`:''}${news.trim()?blocks(news)
      :k===DIG?'<p class="empty">まだありません。ニュースの「深堀り」を押すと、ここに解説が入ります。</p>'
      :'<p class="empty">まだありません。毎朝の更新で、ここに入ります。</p>'}
    </article>
    <p class="note">${k===DIG?'data/深堀り.md をそのまま映しています。「作業中...」の件は、執事が裏で解説に書き換えます。'
      :'data/news/ をそのまま映しています。毎朝、執事が書き換えます。'}</p>`;
  if (k===DIG) return;
  // 太字の見出しで始まる行にだけ、深堀りのボタンを付ける。行は書かれた順に li と対になる
  let day='';
  const items=news.split(/\r?\n/).flatMap(l=>{
    const h=l.match(/^\s*##\s+(\S+)/); if (h) day=h[1];
    return /^\s*[-*]\s+\*\*/.test(l) ? [{day, line:l.trim().replace(/^[-*]\s+/,'')}] : [];
  });
  [...main.querySelectorAll('.doc > ul > li')].filter(li=>li.firstChild?.nodeName==='STRONG')
    .forEach((li,i)=>{ const it=items[i]; if (!it) return;
      const b=document.createElement('button'); b.className='dig'; b.textContent='深堀り';
      b.onclick=()=>{ b.disabled=true; ask(k, it).catch(()=>{ b.disabled=false; b.textContent='もう一度'; }); };
      li.append(b); });
}

/* 深堀りの件を「作業中...」で data/深堀り.md の --- のすぐ下に足す。同じ見出しがもうあれば足さない。
   読んだときと中身が変わっていたら（執事が同時に書いた）、読み直してやり直す */
async function ask(kind, {day, line}){
  const m=line.match(/^\*\*(.+?)\*\*\s*(?:—\s*)?(.*)$/), title=m[1].trim();
  for (let n=0; n<3; n++){
    const r=await fetch(DIGFILE,{cache:'no-store'});
    if (!r.ok && r.status!==404) throw 0;
    let md = r.ok ? await r.text()
      : `# ${DIG}\n\nニュースの「深堀り」で頼んだ話。執事が要約して解説する。新しいものが上。\n\n---\n`;
    if (!md.split(/\r?\n/).some(l=>l.trim()==='## '+title)){
      const entry=`\n## ${title}\n\n${day.slice(5)} ／ ${kind} ／ ${m[2]}\n\n**深堀り**: 作業中...\n`;
      const ls=md.split('\n'), cut=ls.findIndex(l=>/^\s*-{3,}\s*$/.test(l));
      md = cut<0 ? md.replace(/\n*$/,'\n\n---\n')+entry : [...ls.slice(0,cut+1), ...entry.split('\n').slice(0,-1), ...ls.slice(cut+1)].join('\n');
      const w=await fetch(DIGFILE,{method:'PUT', body:md, headers:r.ok?{'If-Match':r.headers.get('ETag')}:{}});
      if (w.status===409) continue;
      if (!w.ok) throw 0;
    }
    location.hash='#'+enc(DIG);
    return;
  }
  throw 0;
}

function fail(){
  main.innerHTML=`<div class="err">
    <b>data/news/ を読めませんでした。</b><br>
    起動：<code>python3 server.py</code> → <code>http://localhost:8765/news.html</code><br>
    （file:// で直接開くと読めません。かならずサーバー越しに）
  </div>`;
}

/* 5 秒ごとに読み直す。執事が書き換えれば、開いたまま変わる */
let last=null;
async function tick(){
  const dot=document.getElementById('dot'), hash=location.hash;
  try{
    const ks=[DIG, ...(await kinds()).filter(n=>n!==DIG)], w=wanted(), k=ks.includes(w)?w:(ks[1]||DIG);
    let md='';
    const f=await fetch(k===DIG?DIGFILE:BASE+enc(k)+'.md',{cache:'no-store'}); if (f.ok) md=await f.text();
    if (hash!==location.hash) return;  // 読んでいる間に開く先が替わった。新しいほうに任せる
    const key=JSON.stringify([ks, k, md]);
    if (key!==last){ last=key; render(ks, k, md); }
    dot.classList.remove('off'); dot.title='追従中';
  }catch(e){
    dot.classList.add('off'); dot.title='未接続';
    if (last===null) fail();
  }
}
addEventListener('hashchange', ()=>tick().then(()=>scrollTo(0,0)));
tick(); setInterval(tick,5000);
</script>
</body>
</html>
